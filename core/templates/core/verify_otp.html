<!DOCTYPE html>
<html lang="en">
<head>
  <title>Verify OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-xl font-bold mb-4 text-center">Enter OTP</h2>

    {% if messages %}
      {% for message in messages %}
        <p class="text-sm text-red-500 mb-2">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <!-- OTP SUBMIT FORM -->
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}

      <p class="text-sm text-gray-600 mb-2">OTP sent to your email.</p>
      <p class="text-sm font-semibold text-blue-600" id="timer"></p>

      <button type="submit"
              class="w-full bg-green-500 text-white py-2 mt-4 rounded hover:bg-green-600">
        Verify OTP
      </button>
    </form>

    <!-- RESEND OTP FORM -->
    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="resend_otp" value="1">
      <button type="submit" id="resendBtn"
              class="w-full mt-3 py-2 rounded bg-gray-300 text-gray-700 cursor-not-allowed"
              disabled>
        Resend OTP
      </button>
    </form>
  </div>

  <script>
    let seconds = 20;
    function countdown() {
      const timerEl = document.getElementById("timer");
      const resendBtn = document.getElementById("resendBtn");

      if (seconds > 0) {
        timerEl.textContent = "You can resend OTP in " + seconds + " seconds";
        resendBtn.disabled = true;
        resendBtn.classList.add("cursor-not-allowed", "bg-gray-300");
        resendBtn.classList.remove("bg-blue-500", "hover:bg-blue-600", "text-white");
        seconds--;
        setTimeout(countdown, 1000);
      } else {
        timerEl.textContent = "Didn't receive the OTP?";
        resendBtn.disabled = false;
        resendBtn.classList.remove("cursor-not-allowed", "bg-gray-300");
        resendBtn.classList.add("bg-blue-500", "hover:bg-blue-600", "text-white");
      }
    }
    window.onload = countdown;
  </script>
</body>
</html>
