 <!-- For icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"  crossorigin="anonymous" referrerpolicy="no-referrer" />
 <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
 {% comment %} <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> {% endcomment %}
 

<div class="sidebar">
    <h2 id="sidebar-socialbuzz" class="font-bold mb-5"><a href="{% url "home" %}">SocialBuzz</a></h2>
    <a href="{% url 'home' %}" {% if request.path == '/' %} id="sidebar-home" style="font-weight: bold; color: cyan;" {% endif %}>
        <i class="fa fa-home"></i>
    </a>
    <a href="{% url 'search-users' %}" {% if request.path == '/search/' %} id="sidebar-search" style="font-weight: bold; color: cyan;" {% endif %}>
        
        
    </a>
    <a href="#" id="sidebar-notifications"><i class='fas fa-bell'></i> Notifications</a>
    <a href="{% url "messages" %}" {% if request.path == '/messages/' %} id="sidebar-profile" style="font-weight: bold; color: cyan;" {% endif %} id="sidebar-messages">
        <i class='fa fa-envelope'></i>
    </a>

    <a href="{% url "register" %}" id="sidebar-create-account">🆕</a>

    {% if user.is_authenticated %}
        <a href="{% url "logout" %}" id="sidebar-logout">
            <i class="fa fa-sign-out"></i>
        </a>
    {% else %}
        <a href="{% url "login" %}" id="sidebar-login">
            <i class="fa fa-sign-in"></i>
        </a>
    {% endif %}

    {% if user.is_authenticated %}
        {% url 'user-profile' request.user.username as user_profile_url %}
        <a href="{% url 'user-profile' request.user %}" {% if request.path == user_profile_url %} id="sidebar-profile" style="font-weight: bold; color: cyan;" {% endif %}>
            <i class='fas fa-user-circle'></i>
        </a>
    {% else %}
        <a href="{% url 'login'%}">
            <i class='fas fa-user-circle'></i>
        </a>
    {% endif %}
